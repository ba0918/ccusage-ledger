name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # npm publish --provenance 用: OIDC トークン（出所証明の署名）を発行するために必要
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Actions は SHA で固定する（v4 タグは移動するため、書き換え時にサプライチェーン攻撃を受ける）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # lockfile 内の依存に既知脆弱性があれば publish を止める（bun.lock は integrity 固定済み）
      - run: bun audit
      # prepublishOnly がテスト・型チェック・lint・build を実行し、publish を publish 直前に走らせる
      # npm pack --dry-run で配布物を検証する。files リストに必要な成果物が含まれること、
      # 秘密ファイル（.env / *.key 等）や個人データ埋め込みのエクスポート HTML が混入しないことを
      # 確認してから公開する（files は明示ファイルリストで、エクスポート成果物や dist/ に
      # 置いた未知のファイルはそもそもパックされない。ここでは除外が効いていること自体を
      # 検証する defense-in-depth）
      - run: |
          output=$(npm pack --dry-run 2>&1)
          echo "$output"
          for expected in dist/bundle.js dist/ccusage-ledger.js public/app.css index.html; do
            if ! echo "$output" | grep -q "$expected"; then
              echo "ERROR: 配布物に $expected が含まれていません" >&2
              exit 1
            fi
          done
          if echo "$output" | grep -q 'ccusage-ledger\.html'; then
            echo "ERROR: 配布物に個人データ埋め込みのエクスポート HTML が含まれています（npm run export の成果物を消してください）" >&2
            exit 1
          fi
          if echo "$output" | grep -qE '\.env(\.|$)|\.pem$|\.key$|credentials|secret'; then
            echo "ERROR: 配布物に秘密ファイルが混入しています" >&2
            exit 1
          fi
      # NODE_AUTH_TOKEN は npm publish 用の認証トークン（GitHub の secret に設定する）
      # --provenance で「このパッケージはこの GitHub リポジトリの CI から公開された」ことを
      # OIDC 署名で証明し、npmjs.com に出所を表示する
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
