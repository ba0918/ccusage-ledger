name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # npm publish --provenance 用: OIDC トークン（出所証明の署名）を発行するために必要
  id-token: write

jobs:
  publish:
    # フォーク先でタグが push されても本流で publish が走らないよう、リポジトリを限定する
    # （upstream の secret は upstream スコープで守られるが、guard を明示して誤実行を構造的に防ぐ）
    if: github.repository == 'ba0918/ccusage-ledger'
    runs-on: ubuntu-latest
    permissions:
      # publish 成功後に GitHub Release を作成するため write が必要
      # （job 単位の permissions は workflow 単位の指定を置き換えるため id-token も再掲する）
      contents: write
      id-token: write
    steps:
      # Actions は SHA で固定する（v4 タグは移動するため、書き換え時にサプライチェーン攻撃を受ける）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # タグが main の履歴に含まれることを検証するため全履歴を取得する
          fetch-depth: 0

      # 重い処理の前に、タグと配布内容の対応が壊れていないことを確認する（fail fast）。
      # npm は同じバージョンの再公開を拒否するため、不一致に気づかず publish すると
      # そのバージョン番号を消費してしまい取り返しがつかない
      - name: タグと package.json の version が一致することを確認する
        run: |
          tag="${GITHUB_REF_NAME}"
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "ERROR: タグ ($tag) と package.json の version ($pkg) が一致しません。" >&2
            echo "       package.json を更新してからタグを打ち直してください。" >&2
            exit 1
          fi
          echo "version check: $tag"

      # リリースは main の履歴からのみ行う（作業ブランチのコミットに誤ってタグを打っても公開されない）
      - name: タグが main の履歴上にあることを確認する
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: タグのコミット ($GITHUB_SHA) が main の履歴に含まれていません。" >&2
            echo "       main にマージしてからタグを打ち直してください。" >&2
            exit 1
          fi
          echo "ancestry check: on main"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      # Trusted Publishing（OIDC）で publish するため、長期トークンは使わない。
      # registry-url は指定しない: 指定すると NODE_AUTH_TOKEN を参照する .npmrc が生成され、
      # 値が空のトークン認証として扱われて OIDC の経路に入らない。
      # Node は 22.14.0 以上が必要（node-version: 22 は 22 系の最新を入れる）
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Trusted Publishing は npm CLI 11.5.1 以上が必要だが、Node 22 に同梱されるのは 10 系。
      # バージョンは明示的に固定する（更新時はここを上げる）
      - run: npm install -g npm@12.0.2
      - run: bun install --frozen-lockfile
      # lockfile 内の依存に既知脆弱性があれば publish を止める（bun.lock は integrity 固定済み）
      - run: bun audit
      # prepublishOnly がテスト・型チェック・lint・build を実行し、publish を publish 直前に走らせる
      # npm pack --dry-run で配布物を検証する。files リストに必要な成果物が含まれること、
      # 秘密ファイル（.env / *.key 等）や個人データ埋め込みのエクスポート HTML が混入しないことを
      # 確認してから公開する（files は明示ファイルリストで、エクスポート成果物や dist/ に
      # 置いた未知のファイルはそもそもパックされない。ここでは除外が効いていること自体を
      # 検証する defense-in-depth）
      - run: |
          output=$(npm pack --dry-run 2>&1)
          echo "$output"
          for expected in dist/bundle.js dist/ccusage-ledger.js public/app.css index.html; do
            if ! echo "$output" | grep -q "$expected"; then
              echo "ERROR: 配布物に $expected が含まれていません" >&2
              exit 1
            fi
          done
          if echo "$output" | grep -q 'ccusage-ledger\.html'; then
            echo "ERROR: 配布物に個人データ埋め込みのエクスポート HTML が含まれています（npm run export の成果物を消してください）" >&2
            exit 1
          fi
          if echo "$output" | grep -qE '\.env(\.|$)|\.pem$|\.key$|credentials|secret'; then
            echo "ERROR: 配布物に秘密ファイルが混入しています" >&2
            exit 1
          fi
      # Trusted Publishing（OIDC）で公開する。npmjs.com 側でこのリポジトリと
      # このワークフローファイルを信頼するよう設定しておく必要がある（事前設定が前提）。
      # 長期トークンを持たないため、トークン漏洩・失効・OTP 要求（EOTP）の問題が構造的に無くなる。
      # provenance は Trusted Publishing では自動付与されるため --provenance は指定しない
      - run: npm publish --access public

      # publish が成功した後に GitHub Release を作る（publish 失敗時に Release だけが残らない順序）。
      # gh はランナーに同梱されているため、Release 作成のために追加の Action を増やさない
      # （uses: が増えるほど SHA ピンの維持対象が増える）。
      # --verify-tag: 同名タグが実在することを確認してから作成する
      - name: GitHub Release を作成する
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
