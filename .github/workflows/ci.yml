name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions は SHA で固定する（v4/v2 タグは移動するため、書き換え時にサプライチェーン攻撃を受ける）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      - run: bun run lint
      - run: bun run build
      # npm audit は package-lock.json が無いため ENOLOCK で常に失敗する。
      # bun.lock を直接監査する bun audit を使う（bun 1.2.30+ で利用可能）
      - run: bun audit

  # 配布物を Node で起動して応答を検証する（npx 対応のスモークテスト）
  node-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm pack
      - run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          npm install /home/runner/work/ccusage-ledger/ccusage-ledger/ccusage-ledger-*.tgz
          # 実ユーザーに近い経路（データディレクトリ env を実際に渡して ccusage を実行する）を
          # 通すため、空のデータディレクトリを用意する。存在しない場合は env を渡さない挙動に
          # なるので、この mkdir が無くても起動自体は成功する
          mkdir -p "$HOME/.claude/projects"
          node ./node_modules/.bin/ccusage-ledger > server.log 2>&1 &
          SERVER_PID=$!
          # 起動完了は HTTP の bind ではなくデータ取得の完了で待つ。bind は fetchUsage より
          # 先に済むため、bind だけを見て次へ進むと "Data source:" がまだ出ておらず、
          # ランナーが速いときだけ落ちる競合になる（実際に CI が不定期に落ちた）
          for i in $(seq 1 60); do
            if grep -qE "Data source:|WARN: failed to fetch" server.log 2>/dev/null; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:3737/
          curl -sf -o /dev/null http://127.0.0.1:3737/dist/bundle.js
          curl -sf -o /dev/null http://127.0.0.1:3737/api/usage

          # ccusage の解決や整合性検証に失敗しても /api/usage は空データで 200 を返すため、
          # ステータスだけでは「Node ではデータが取れない」不具合を検知できない。
          # 起動ログでデータ取得と整合性検証の成否を確認する
          cat server.log
          if ! grep -q "Data source:" server.log; then
            echo "ERROR: Node ランタイムで ccusage からデータを取得できていません" >&2
            exit 1
          fi
          if grep -qE "ccusage is not installed|integrity check failed" server.log; then
            echo "ERROR: 配布物から ccusage を解決・検証できていません" >&2
            exit 1
          fi

          # ミドルウェア・フレームワーク組み込みの応答でセキュリティヘッダが抜けないことを確認する
          headers=$(curl -s -D- -o /dev/null -H "Host: evil.example.com" http://127.0.0.1:3737/)
          # ステータス行そのものを見る（ヘッダ値に偶然 400 が含まれても通らないようにする）
          echo "$headers" | grep -qE "^HTTP/[0-9.]+ 400" || { echo "ERROR: Host 検証が効いていません" >&2; exit 1; }
          for header in content-security-policy x-frame-options x-content-type-options; do
            if ! echo "$headers" | grep -qi "^$header:"; then
              echo "ERROR: 400 応答に $header が付いていません" >&2
              exit 1
            fi
          done

          # 許可リスト外のパスが配信されないことを確認する
          status=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3737/..%2fpackage.json")
          [ "$status" = "404" ] || { echo "ERROR: トラバーサルが 404 になりません ($status)" >&2; exit 1; }

          kill $SERVER_PID

          # --host での LAN 公開が、配布物・Node ランタイムでもガードされることを確認する。
          # 非 TTY では CCUSAGE_LEDGER_ALLOW_LAN が無ければ起動を拒否する（fail-closed）
          set +e
          lan_out=$(node ./node_modules/.bin/ccusage-ledger --host 0.0.0.0 < /dev/null 2>&1)
          lan_code=$?
          set -e
          echo "$lan_out"
          [ "$lan_code" = "1" ] || { echo "ERROR: --host 0.0.0.0 が非 TTY で拒否されません ($lan_code)" >&2; exit 1; }
          echo "$lan_out" | grep -q -- "--host=0.0.0.0" || { echo "ERROR: 拒否メッセージに指定元が出ていません" >&2; exit 1; }

          # --port と PORT の両方が効き、起動ログに決定元が出ることを確認する
          PORT=3939 node ./node_modules/.bin/ccusage-ledger --host 127.0.0.1 > host.log 2>&1 &
          HOST_PID=$!
          # ここも bind ではなく起動ログの完了を待つ（上と同じ理由）。
          # fetchUsage は最大 60s 掛かりうるため待ち時間も揃える
          for i in $(seq 1 60); do
            if grep -q "ccusage ledger:" host.log 2>/dev/null; then break; fi
            sleep 1
          done
          cat host.log
          grep -q "http://127.0.0.1:3939" host.log || { echo "ERROR: --host / PORT が反映されていません" >&2; exit 1; }
          grep -q -- "(host from --host)" host.log || { echo "ERROR: host の決定元が出ていません" >&2; exit 1; }
          grep -q "(port from PORT)" host.log || { echo "ERROR: port の決定元が出ていません" >&2; exit 1; }
          kill $HOST_PID

          echo "node smoke: OK"
