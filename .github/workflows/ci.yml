name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions は SHA で固定する（v4/v2 タグは移動するため、書き換え時にサプライチェーン攻撃を受ける）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      - run: bun run build
      # npm audit は package-lock.json が無いため ENOLOCK で常に失敗する。
      # bun.lock を直接監査する bun audit を使う（bun 1.2.30+ で利用可能）
      - run: bun audit
