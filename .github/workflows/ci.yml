name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions は SHA で固定する（v4/v2 タグは移動するため、書き換え時にサプライチェーン攻撃を受ける）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      - run: bun run lint
      - run: bun run build
      # npm audit は package-lock.json が無いため ENOLOCK で常に失敗する。
      # bun.lock を直接監査する bun audit を使う（bun 1.2.30+ で利用可能）
      - run: bun audit

  # 配布物を Node で起動して応答を検証する（npx 対応のスモークテスト）
  node-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm pack
      - run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          npm install /home/runner/work/ccusage-ledger/ccusage-ledger/ccusage-ledger-*.tgz
          node ./node_modules/.bin/ccusage-ledger > server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3000/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:3000/
          curl -sf -o /dev/null http://127.0.0.1:3000/dist/bundle.js
          curl -sf -o /dev/null http://127.0.0.1:3000/api/usage
          kill $SERVER_PID
          echo "node smoke: OK"
