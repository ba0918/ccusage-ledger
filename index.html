<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ccusage Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1117;
        --panel: #1a1d27;
        --border: #2a2e3d;
        --text: #e6e8ef;
        --muted: #9aa0b0;
        --accent: #6ea8fe;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
      }
      h1 { font-size: 20px; margin: 0; }
      .controls { display: flex; gap: 12px; flex-wrap: wrap; }
      label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
      select {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 14px;
      }
      main { padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      .chart-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        height: 300px;
      }
      .chart-card h2 { font-size: 15px; margin: 0 0 12px; color: var(--text); }
      .chart-card.wide { grid-column: 1 / -1; }
      .chart-card .chart-wrap { flex: 1; min-height: 0; }
      canvas { width: 100%; height: 100%; }
      #status { color: var(--muted); font-size: 13px; }
      #status.error { color: #ff8b8b; }
    </style>
  </head>
  <body>
    <header>
      <h1>ccusage Dashboard</h1>
      <div class="controls">
        <label>期間
          <select id="section">
            <option value="daily">日次</option>
            <option value="monthly">月次</option>
            <option value="yearly">年次</option>
          </select>
        </label>
        <label>モデル
          <select id="model"><option value="">すべて</option></select>
        </label>
        <label>エージェント
          <select id="agent"><option value="">すべて</option></select>
        </label>
        <span id="status"></span>
      </div>
    </header>
    <main>
      <div class="chart-card">
        <h2>日別コスト積み上げ（モデル別）</h2>
        <div class="chart-wrap"><canvas id="chart-daily-cost"></canvas></div>
      </div>
      <div class="chart-card">
        <h2>月別コスト</h2>
        <div class="chart-wrap"><canvas id="chart-monthly-cost"></canvas></div>
      </div>
      <div class="chart-card">
        <h2>モデル構成比率トレンド</h2>
        <div class="chart-wrap"><canvas id="chart-model-mix"></canvas></div>
      </div>
      <div class="chart-card">
        <h2>単価推移（$/MTok）</h2>
        <div class="chart-wrap"><canvas id="chart-unit-price"></canvas></div>
      </div>
      <div class="chart-card wide">
        <h2>キャッシュヒット率推移</h2>
        <div class="chart-wrap"><canvas id="chart-cache-hit"></canvas></div>
      </div>
    </main>
    <script src="/public/vendor/chart.umd.min.js"></script>
    <script src="/dist/bundle.js"></script>
  </body>
</html>
